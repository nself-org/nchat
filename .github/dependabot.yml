version: 2

# Docker Hub credentials for the docker ecosystem.
#
# Dependabot pulls base-image tags through its own proxy, which hits Docker Hub
# anonymously unless a registry is declared here. Anonymous pulls of
# library/node are now refused outright:
#   {"code":"UNAUTHORIZED","message":"authentication required",
#    "detail":[{"Name":"library/node","Action":"pull"}]}
# which failed the whole Dependabot run — and one errored ecosystem fails every
# other ecosystem in that run with it.
#
# Secrets are set at the repo level under the "dependabot" app (they are a
# separate store from Actions secrets; an Actions secret of the same name is
# NOT visible here).
registries:
  dockerhub:
    type: docker-registry
    url: registry.hub.docker.com
    username: ${{secrets.DOCKERHUB_USERNAME}}
    password: ${{secrets.DOCKERHUB_TOKEN}}

updates:
  # npm/pnpm dependencies.
  #
  # Use `directories` (plural), listing the workspace root AND every member.
  # Both of the obvious single-directory settings are wrong here:
  #
  #   directory: '/frontend'  — Dependabot edited frontend/package.json, then
  #     looked for a lockfile beside it, found none, and left the root
  #     pnpm-lock.yaml untouched. CI installs with --frozen-lockfile, so every
  #     resulting PR died at install with ERR_PNPM_OUTDATED_LOCKFILE before a
  #     single gate ran. Six unmergeable PRs accumulated.
  #
  #   directory: '/'  — the fix for the above, and wrong in the other
  #     direction. The root package.json declares ZERO dependencies; this repo
  #     keeps all of them in workspace members. Dependabot read the shared
  #     lockfile, found the transitive set, and then could not act on any of
  #     it, failing the whole run with one row per dependency:
  #
  #       <name> | dependency_file_not_resolvable |
  #         "No package named \"<name>\" present in workspace."
  #
  #     Observed 2026-09-14 (job 1575233434): ~60 rows, zero PRs, and the
  #     errored ecosystem failed the github-actions and docker ecosystems in
  #     the same run with it.
  #
  # `directories` gives Dependabot the member manifests to edit while it still
  # resolves the single root lockfile, which is what pnpm workspaces need.
  # Members are listed explicitly to match pnpm-workspace.yaml. Two other
  # package.json files exist (frontend/platforms/desktop, frontend/src/cli) and
  # are deliberately absent: they are not workspace members, so they have no
  # entry in the root lockfile and Dependabot cannot resolve them either.
  # '../packages/@nself/*' is a workspace member outside this repository (the
  # nself-org/packages repo) and is updated there, not here.
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/frontend'
      - '/frontend-vite'
      - '/frontend/platforms/mobile'
      - '/desktop'
      - '/packages/*'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    reviewers:
      - 'nself/core-team'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Group minor and patch updates
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      # Separate group for major updates
      major:
        patterns:
          - '*'
        update-types:
          - 'major'
      # React ecosystem
      react:
        patterns:
          - 'react'
          - 'react-*'
          - '@types/react'
          - '@types/react-*'
      # Next.js ecosystem
      nextjs:
        patterns:
          - 'next'
          - 'next-*'
          - '@next/*'
      # Testing
      testing:
        patterns:
          - 'jest'
          - 'jest-*'
          - '@jest/*'
          - '@testing-library/*'
          - '@playwright/*'
          - 'playwright'
      # Radix UI
      radix:
        patterns:
          - '@radix-ui/*'
      # ESLint and Prettier
      linting:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'prettier'
          - 'prettier-*'
      # TypeScript
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
          - '@typescript-eslint/*'
    ignore:
      # Ignore major React updates (manual review required)
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      # Ignore major Next.js updates
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    reviewers:
      - 'nself/devops-team'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns:
          - '*'

  # Docker dependencies.
  #
  # The Dockerfiles live under .github/deploy/docker/, not the repo root.
  # Pointed at '/', every Dependabot run failed the whole job with
  #   dependency_file_not_found: No Dockerfiles nor Kubernetes YAML found in /
  # which took the npm and github-actions ecosystems down with it, since one
  # errored ecosystem fails the entire "Dependabot Updates" run.
  - package-ecosystem: 'docker'
    directory: '/.github/deploy/docker'
    registries:
      - dockerhub
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 3
    reviewers:
      - 'nself/devops-team'
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'chore(docker)'
    ignore:
      # Node MAJOR bumps are a repo-wide decision, not a Dockerfile edit.
      # Every workflow in .github/workflows pins NODE_VERSION: '22', and the
      # three stages of deploy/docker/Dockerfile plus Dockerfile.dev pin
      # node:22-alpine to match. Moving the image alone would put the published
      # container on a different major than everything CI tests against.
      #
      # This also unblocks the weekly run. On 2026-09-14 (job 1575256237)
      # Dependabot resolved node 22-alpine -> 26-alpine and GitHub refused the
      # pull request outright:
      #
      #   POST /update_jobs/.../create_pull_request -> 400
      #   {"detail":"The request contains invalid or unauthorized changes"}
      #   Handled error whilst updating node: dependency_file_not_supported
      #
      # It is refused server-side at PR creation, after a clean resolution, so
      # there is nothing in this repo to correct; the change GitHub rejects is
      # a write under .github/, which is where these Dockerfiles live per the
      # clean-root rule. That refusal failed the entire Dependabot Updates run,
      # taking npm and github-actions down with it. Suppressing the update that
      # cannot be delivered keeps the other ecosystems running.
      #
      # Minor and patch image updates are NOT ignored and still open PRs.
      # The Node 22 -> current-LTS upgrade is tracked as its own repo-wide task.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
