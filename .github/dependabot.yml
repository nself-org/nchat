version: 2
updates:
  # npm/pnpm dependencies.
  #
  # directory MUST be the pnpm workspace root, not a member package.
  # pnpm keeps one lockfile at the root for every workspace member. Pointed at
  # '/frontend', Dependabot edited frontend/package.json and then looked for a
  # lockfile beside it, found none, and left the root pnpm-lock.yaml untouched.
  # CI installs with --frozen-lockfile, so every resulting PR died at the
  # install step with ERR_PNPM_OUTDATED_LOCKFILE before a single gate ran:
  #
  #   Cannot install with "frozen-lockfile" because pnpm-lock.yaml
  #   is not up to date with <ROOT>/frontend/package.json
  #
  # That made the PRs unmergeable by construction, not by regression. Six of
  # them accumulated. From the root, Dependabot updates member manifests and
  # regenerates the shared lockfile in the same commit.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    reviewers:
      - 'nself/core-team'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Group minor and patch updates
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      # Separate group for major updates
      major:
        patterns:
          - '*'
        update-types:
          - 'major'
      # React ecosystem
      react:
        patterns:
          - 'react'
          - 'react-*'
          - '@types/react'
          - '@types/react-*'
      # Next.js ecosystem
      nextjs:
        patterns:
          - 'next'
          - 'next-*'
          - '@next/*'
      # Testing
      testing:
        patterns:
          - 'jest'
          - 'jest-*'
          - '@jest/*'
          - '@testing-library/*'
          - '@playwright/*'
          - 'playwright'
      # Radix UI
      radix:
        patterns:
          - '@radix-ui/*'
      # ESLint and Prettier
      linting:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'prettier'
          - 'prettier-*'
      # TypeScript
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
          - '@typescript-eslint/*'
    ignore:
      # Ignore major React updates (manual review required)
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      # Ignore major Next.js updates
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    reviewers:
      - 'nself/devops-team'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns:
          - '*'

  # Docker dependencies.
  #
  # The Dockerfiles live under .github/deploy/docker/, not the repo root.
  # Pointed at '/', every Dependabot run failed the whole job with
  #   dependency_file_not_found: No Dockerfiles nor Kubernetes YAML found in /
  # which took the npm and github-actions ecosystems down with it, since one
  # errored ecosystem fails the entire "Dependabot Updates" run.
  - package-ecosystem: 'docker'
    directory: '/.github/deploy/docker'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 3
    reviewers:
      - 'nself/devops-team'
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'chore(docker)'
