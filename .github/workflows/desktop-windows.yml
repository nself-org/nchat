name: Desktop — Windows (Tauri 2)

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'desktop/**'
      # desktop/ bundles the workspace packages it depends on (@nself-chat/ui,
      # @nself-chat/state, ...), so a change there can break this build.
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build:
    name: Build (x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm-workspace.yaml globs '../packages/@nself/*', i.e. the nself-org/packages
      # repo as a SIBLING directory. desktop/package.json depends on five of them
      # (auth-core, graphql-client, i18n, observability, ui) as workspace:*, and
      # desktop/src/main.tsx imports @nself/observability directly. Checking out only
      # nchat leaves those unresolvable, and the Vite build dies with
      # 'Rollup failed to resolve import "@nself/observability"'.
      #
      # Check out into a subdirectory and MOVE it to the sibling path rather than
      # symlinking: pnpm writes relative node_modules links that resolve against the
      # physical path, so they dangle through a symlink (see nsentry ci.yml).
      - name: Checkout @nself packages (sibling workspace dir)
        uses: actions/checkout@v7
        with:
          repository: nself-org/packages
          # Pinned, not floating: pnpm-lock.yaml below now contains importers for
          # these 16 packages, so a frozen install only agrees with the sibling at
          # this exact commit. Tracking main would red the desktop builds on the
          # next push to nself-org/packages. Bump this sha and regenerate the
          # lockfile together.
          ref: 8a5cc53106fae71474f822003645d1f51dcfcd95
          path: _nself_packages
          persist-credentials: false

      - name: Move @nself packages to the sibling path pnpm expects
        shell: bash
        run: |
          PARENT_DIR="$(dirname "$GITHUB_WORKSPACE")"
          rm -rf "$PARENT_DIR/packages"
          mv "$GITHUB_WORKSPACE/_nself_packages" "$PARENT_DIR/packages"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: windows-x64-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      # Scoped install: --filter ...desktop pulls in only the workspace
      # packages the Tauri build actually needs (ui/core/state/config/api +
      # @nself/* deps). `--filter ...desktop` alone does NOT stop pnpm from
      # resolving/building every workspace project's own deps against the
      # shared lockfile+store (shamefully-hoist=true in .npmrc hoists
      # everything to the root node_modules regardless of filter), so
      # `frontend`'s test-only native dep `canvas` was still attempted and
      # failed node-gyp compilation on windows-2022 (no GTK/cairo dev
      # headers on the runner, no Windows prebuilt binary for this version).
      # Explicitly excluding @nself-chat/web (frontend) from the install
      # graph is what actually skips it.
      - name: Install pnpm deps (desktop + workspace deps only)
        working-directory: .
        run: pnpm install --frozen-lockfile --filter "...@nself-chat/desktop" --filter "!@nself-chat/web"

      - name: Build workspace packages (@nself-chat/ui etc.)
        working-directory: .
        shell: bash
        run: pnpm --filter "@nself-chat/ui" --filter "@nself-chat/core" --filter "@nself-chat/state" --filter "@nself-chat/config" build

      - name: Build Tauri (Windows x64)
        working-directory: desktop
        run: pnpm tauri build --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # T17: EV code-signing via SSL.com eSigner — gated on org secret presence.
      # DPI is handled automatically by Tauri 2's Windows manifest (T23 — no custom manifest needed).
      # secrets context is not allowed in step `if:` — it invalidates the whole
      # workflow at parse time (0-job startup failure on every push). Gate via an
      # output check instead.
      - name: Check EV signing secret presence
        id: evcheck
        shell: bash
        env:
          SSL_USER: ${{ secrets.SSL_COM_USERNAME }}
        run: echo "present=$([ -n "$SSL_USER" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Sign Windows MSI (EV, SSL.com eSigner)
        if: steps.evcheck.outputs.present == 'true' 
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.SSL_COM_USERNAME }}
          password: ${{ secrets.SSL_COM_PASSWORD }}
          credential_id: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSL_COM_TOTP_SECRET }}
          file_path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          override: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-x64
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.zip
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.zip.sig
          retention-days: 14

      # T18 — publish updater feed to S3 (tag pushes only)
      - name: Publish updater feed (S3)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          AWS_ENDPOINT_URL: https://fsn1.your-objectstorage.com
        run: |
          for sig in desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.zip.sig; do
            [ -f "$sig" ] || continue
            aws s3 cp "$sig" s3://packages.nself.org/chat-desktop/ --endpoint-url "$AWS_ENDPOINT_URL"
            aws s3 cp "${sig%.sig}" s3://packages.nself.org/chat-desktop/ --endpoint-url "$AWS_ENDPOINT_URL"
          done
